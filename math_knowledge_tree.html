<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mathematics Knowledge Tree — Premium</title>
<style>
  :root {
    --bg: #0a0e14;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-strong: rgba(0, 255, 255, 0.18);
    --text: #e8f0ff;
    --muted: #a7b3c6;
    --link: rgba(200, 210, 255, 0.18);
    --link-glow: #00e5ff;
    --accent: #00d4ff;
    --accent-2: #7cf7ff;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(1200px 800px at 80% 20%, rgba(0, 212, 255, 0.06), transparent),
                radial-gradient(800px 600px at 10% 80%, rgba(124, 247, 255, 0.05), transparent),
                var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    overflow: hidden;
  }

  /* Controls */
  .controls {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    gap: 10px;
    z-index: 20;
  }

  #searchBox {
    padding: 11px 14px 11px 42px;
    width: 360px;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 10px 30px rgba(0,0,0,0.35), 0 0 12px rgba(0, 212, 255, 0.25);
    color: var(--text);
    outline: none;
    font-size: 15px;
    letter-spacing: 0.1px;
    transition: box-shadow 0.2s ease;
  }
  #searchBox:focus {
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 10px 30px rgba(0,0,0,0.35), 0 0 18px rgba(0, 212, 255, 0.4);
  }

  .search-icon {
    position: absolute;
    top: 9px;
    left: 20px;
    width: 22px;
    height: 22px;
    pointer-events: none;
    opacity: 0.8;
    filter: drop-shadow(0 0 6px rgba(0, 212, 255, 0.3));
  }

  #searchButton, #resetButton {
    padding: 11px 14px;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: linear-gradient(180deg, rgba(0, 255, 255, 0.18), rgba(0, 255, 255, 0.08));
    box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 12px rgba(0, 212, 255, 0.28);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
  }
  #resetButton {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255,255,255,0.04));
  }
  #searchButton:hover, #resetButton:hover { transform: translateY(-1px); }
  #searchButton:active, #resetButton:active { transform: translateY(0); }

  /* Suggestions */
  #suggestions {
    position: absolute;
    top: 52px;
    left: 14px;
    width: 416px;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(20, 26, 36, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.45), 0 0 30px rgba(0,212,255,0.18);
    z-index: 18;
    display: none;
  }
  #suggestions ul { list-style: none; margin: 6px 0; padding: 6px 0; max-height: 320px; overflow: auto; }
  #suggestions li {
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  #suggestions li:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.06); }
  #suggestions li .pill {
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  #suggestions li.active, #suggestions li:hover {
    background: linear-gradient(90deg, rgba(0, 212, 255, 0.12), transparent 60%);
  }

  /* Legend */
  .legend {
    position: absolute;
    right: 16px;
    bottom: 16px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(20, 26, 36, 0.65);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted);
    font-size: 12px;
    backdrop-filter: blur(6px);
    z-index: 12;
  }
  .legend strong { color: var(--text); }

  /* Graph */
  #graph { width: 100vw; height: 100vh; cursor: grab; }
  #graph:active { cursor: grabbing; }

  .link {
    stroke: var(--link);
    stroke-width: 2px;
    transition: stroke 0.35s ease, stroke-width 0.35s ease, opacity 0.35s ease;
    opacity: 0.85;
  }
  .link.dim { opacity: 0.2; }

  .node circle {
    stroke: rgba(255,255,255,0.85);
    stroke-width: 1.2px;
    fill: rgba(255,255,255,0.06);
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.45));
    transition: filter 0.35s ease, r 0.2s ease, opacity 0.35s ease;
  }
  .node text {
    fill: var(--text);
    font-weight: 500;
    font-size: 13px;
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(0,0,0,0.35);
    stroke-width: 2px;
  }
  .node.dim circle, .node.dim text { opacity: 0.28; }

  .glow-node circle {
    filter: drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 28px var(--accent));
    r: 22 !important;
  }
  .glow-target circle {
    filter: drop-shadow(0 0 12px var(--accent-2)) drop-shadow(0 0 34px var(--accent-2));
    r: 26 !important;
  }
  .glow-link {
    stroke: var(--link-glow) !important;
    stroke-width: 3px !important;
    filter: drop-shadow(0 0 8px var(--link-glow));
  }
</style>
</head>
<body>
  <div class="controls">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 0 0 1.57-4.23 6.5 6.5 0 1 0-6.5 6.5 6.471 6.471 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z" />
    </svg>
    <input id="searchBox" type="text" placeholder="Search any math topic… (Enter)" autocomplete="off" />
    <button id="searchButton" title="Search (Enter)">Search</button>
    <button id="resetButton" title="Clear highlight & reset view">Reset</button>
  </div>
  <div id="suggestions"><ul></ul></div>

  <svg id="graph"></svg>

  <div class="legend">
    <div><strong>Tip</strong>: Pan with mouse, scroll to zoom, drag nodes to arrange, double-click a node to pin/unpin.</div>
    <div>Arrow direction shows prerequisite ➜ next topic.</div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    // Data
    const nodes = [
      { id: 'Mathematics', group: 1 },
      { id: 'Arithmetic', group: 2 },
      { id: 'Pre-Algebra', group: 2 },
      { id: 'Algebra I', group: 3 },
      { id: 'Geometry', group: 3 },
      { id: 'Trigonometry', group: 4 },
      { id: 'Algebra II', group: 4 },
      { id: 'Pre-Calculus', group: 4 },
      { id: 'Calculus I', group: 5 },
      { id: 'Calculus II', group: 5 },
      { id: 'Calculus III', group: 5 },
      { id: 'Linear Algebra', group: 5 },
      { id: 'Differential Equations', group: 6 },
      { id: 'Probability', group: 6 },
      { id: 'Statistics', group: 6 },
      { id: 'Real Analysis', group: 7 },
      { id: 'Complex Analysis', group: 7 },
      { id: 'Abstract Algebra', group: 7 },
      { id: 'Topology', group: 8 },
      { id: 'Functional Analysis', group: 8 },
      { id: 'Algebraic Geometry', group: 9 },
      { id: 'Number Theory', group: 9 },
      { id: 'Category Theory', group: 10 }
    ];

    const links = [
      { source: 'Mathematics', target: 'Arithmetic' },
      { source: 'Arithmetic', target: 'Pre-Algebra' },
      { source: 'Pre-Algebra', target: 'Algebra I' },
      { source: 'Algebra I', target: 'Geometry' },
      { source: 'Geometry', target: 'Trigonometry' },
      { source: 'Algebra I', target: 'Algebra II' },
      { source: 'Algebra II', target: 'Pre-Calculus' },
      { source: 'Trigonometry', target: 'Pre-Calculus' },
      { source: 'Pre-Calculus', target: 'Calculus I' },
      { source: 'Calculus I', target: 'Calculus II' },
      { source: 'Calculus II', target: 'Calculus III' },
      { source: 'Calculus I', target: 'Linear Algebra' },
      { source: 'Linear Algebra', target: 'Differential Equations' },
      { source: 'Calculus III', target: 'Differential Equations' },
      { source: 'Probability', target: 'Statistics' },
      { source: 'Differential Equations', target: 'Real Analysis' },
      { source: 'Real Analysis', target: 'Complex Analysis' },
      { source: 'Linear Algebra', target: 'Abstract Algebra' },
      { source: 'Abstract Algebra', target: 'Algebraic Geometry' },
      { source: 'Abstract Algebra', target: 'Number Theory' },
      { source: 'Topology', target: 'Algebraic Geometry' },
      { source: 'Functional Analysis', target: 'Category Theory' },
      { source: 'Complex Analysis', target: 'Category Theory' }
    ];

    // Dimensions
    const svg = d3.select('#graph');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const g = svg.append('g');

    // Arrowhead markers
    const defs = svg.append('defs');
    defs.append('marker')
      .attr('id', 'arrow')
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 24)
      .attr('refY', 0)
      .attr('markerWidth', 6)
      .attr('markerHeight', 6)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-5L10,0L0,5')
      .attr('fill', 'rgba(200,210,255,0.7)');

    defs.append('marker')
      .attr('id', 'arrow-glow')
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 24)
      .attr('refY', 0)
      .attr('markerWidth', 7)
      .attr('markerHeight', 7)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-5L10,0L0,5')
      .attr('fill', '#00e5ff');

    const zoomBehavior = d3.zoom()
      .scaleExtent([0.3, 3])
      .on('zoom', (event) => {
        g.attr('transform', event.transform);
      });

    svg.call(zoomBehavior);

    // Simulation
    const simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(d => 150 + (d.source.group + d.target.group) * 3))
      .force('charge', d3.forceManyBody().strength(-800))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force('collision', d3.forceCollide().radius(42));

    // Links
    const link = g.append('g')
      .attr('stroke-linecap', 'round')
      .selectAll('line')
      .data(links)
      .join('line')
      .attr('class', 'link')
      .attr('marker-end', 'url(#arrow)');

    // Nodes
    const node = g.append('g')
      .selectAll('g')
      .data(nodes)
      .join('g')
      .attr('class', 'node')
      .call(drag(simulation))
      .on('dblclick', (_, d) => {
        // Toggle pin
        const pinned = d.fx != null || d.fy != null;
        if (pinned) { d.fx = null; d.fy = null; }
        else { d.fx = d.x; d.fy = d.y; }
      })
      .on('click', (_, d) => {
        highlightTopic(d.id);
      });

    node.append('circle')
      .attr('r', 18)
      .attr('fill', d => d3.interpolateCool(d.group / 12));

    node.append('text')
      .text(d => d.id)
      .attr('x', 22)
      .attr('dy', 4);

    simulation.on('tick', () => {
      link
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y);

      node
        .attr('transform', d => `translate(${d.x},${d.y})`);
    });

    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      svg.attr('width', w).attr('height', h);
      simulation.force('center', d3.forceCenter(w / 2, h / 2));
      simulation.alpha(0.3).restart();
    });

    // Drag behavior
    function drag(simulation) {
      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      }
      function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        // keep pinned if user double-clicked before releasing
        if (d.fx !== null && d.fy !== null && event.sourceEvent && event.sourceEvent.detail === 2) return;
        d.fx = null; d.fy = null;
      }
      return d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended);
    }

    // Build reverse adjacency for prerequisite traversal
    const idToNode = new Map(nodes.map(n => [n.id.toLowerCase(), n]));
    const parentsMap = new Map(); // target -> [sources]
    links.forEach(l => {
      const t = l.target.toLowerCase();
      const s = l.source.toLowerCase();
      if (!parentsMap.has(t)) parentsMap.set(t, []);
      parentsMap.get(t).push(s);
    });

    function collectPrereqClosure(targetIdLower) {
      const visited = new Set();
      const edgeKeys = new Set();
      const queue = [targetIdLower];
      while (queue.length) {
        const current = queue.shift();
        const parents = parentsMap.get(current) || [];
        for (const p of parents) {
          if (!visited.has(p)) {
            visited.add(p);
            queue.push(p);
          }
          edgeKeys.add(`${p}||${current}`);
        }
      }
      return { nodes: visited, edges: edgeKeys };
    }

    function clearGlow() {
      node.classed('glow-node', false).classed('glow-target', false).classed('dim', false);
      link.classed('glow-link', false).classed('dim', false)
          .attr('marker-end', 'url(#arrow)');
    }

    function zoomToNode(d, scale = 1.3) {
      const transform = d3.zoomIdentity
        .translate(window.innerWidth / 2, window.innerHeight / 2)
        .scale(scale)
        .translate(-d.x, -d.y);
      svg.transition().duration(900).ease(d3.easeCubicOut)
        .call(zoomBehavior.transform, transform);
    }

    function applyGlow(termLower) {
      clearGlow();
      const n = idToNode.get(termLower);
      if (!n) return;

      const { nodes: prereqSet, edges: edgeSet } = collectPrereqClosure(termLower);

      // Dim everything else
      node.classed('dim', true);
      link.classed('dim', true);

      // Glow target
      node.filter(d => d.id.toLowerCase() === termLower)
          .classed('glow-target', true)
          .classed('dim', false);

      // Glow prereq nodes in a staggered sequence
      const prereqArray = Array.from(prereqSet);
      let delay = 0;
      for (const nid of prereqArray) {
        setTimeout(() => {
          node.filter(d => d.id.toLowerCase() === nid)
              .classed('glow-node', true)
              .classed('dim', false);
        }, delay);
        delay += 180;
      }

      // Glow edges along the prerequisite closure
      link.each(function(l) {
        const key = `${l.source.id.toLowerCase()}||${l.target.id.toLowerCase()}`;
        if (edgeSet.has(key)) {
          d3.select(this).classed('glow-link', true).classed('dim', false)
            .attr('marker-end', 'url(#arrow-glow)');
        }
      });

      zoomToNode(n);
    }

    // Fuzzy search helpers
    const topics = nodes.map(n => n.id);

    function scoreTopic(query, candidate) {
      const q = query.toLowerCase();
      const c = candidate.toLowerCase();
      if (q === c) return 0; // exact
      if (c.startsWith(q)) return 1; // prefix
      if (c.includes(q)) return 2; // substring
      // simple subsequence score
      let i = 0; let j = 0;
      while (i < q.length && j < c.length) {
        if (q[i] === c[j]) i++;
        j++;
      }
      return i === q.length ? 3 : 99; // 3 if subsequence, otherwise reject
    }

    function bestMatch(query) {
      let best = { item: null, score: Infinity };
      for (const t of topics) {
        const s = scoreTopic(query, t);
        if (s < best.score) best = { item: t, score: s };
      }
      return best.item;
    }

    function getSuggestions(query, max = 8) {
      if (!query) return [];
      const scored = topics.map(t => ({ t, s: scoreTopic(query, t) }))
        .filter(x => x.s < 99)
        .sort((a, b) => a.s - b.s || a.t.localeCompare(b.t));
      return scored.slice(0, max).map(x => x.t);
    }

    // UI: suggestions dropdown
    const searchBox = document.getElementById('searchBox');
    const suggestionsEl = document.getElementById('suggestions');
    const suggestionsList = suggestionsEl.querySelector('ul');

    let activeIndex = -1;

    function renderSuggestions(items) {
      suggestionsList.innerHTML = '';
      if (!items.length) { suggestionsEl.style.display = 'none'; return; }
      items.forEach((txt, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${txt}</span><span class="pill">topic</span>`;
        if (idx === activeIndex) li.classList.add('active');
        li.addEventListener('mousedown', e => { // use mousedown to avoid blur before click
          e.preventDefault();
          selectSuggestion(txt);
        });
        suggestionsList.appendChild(li);
      });
      suggestionsEl.style.display = 'block';
    }

    function selectSuggestion(text) {
      searchBox.value = text;
      suggestionsEl.style.display = 'none';
      highlightTopic(text);
    }

    searchBox.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      activeIndex = -1;
      renderSuggestions(getSuggestions(q));
    });

    searchBox.addEventListener('keydown', (e) => {
      const items = Array.from(suggestionsList.querySelectorAll('li'));
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIndex = items.length ? (activeIndex + 1 + items.length) % items.length : -1;
        renderSuggestions(items.map(li => li.querySelector('span').textContent));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIndex = items.length ? (activeIndex - 1 + items.length) % items.length : -1;
        renderSuggestions(items.map(li => li.querySelector('span').textContent));
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeIndex >= 0 && items[activeIndex]) {
          const txt = items[activeIndex].querySelector('span').textContent;
          selectSuggestion(txt);
        } else {
          highlightTopic(searchBox.value.trim());
        }
      } else if (e.key === 'Escape') {
        suggestionsEl.style.display = 'none';
      }
    });

    document.addEventListener('click', (e) => {
      if (!suggestionsEl.contains(e.target) && e.target !== searchBox) {
        suggestionsEl.style.display = 'none';
      }
    });

    document.getElementById('searchButton').addEventListener('click', () => {
      highlightTopic(searchBox.value.trim());
    });

    document.getElementById('resetButton').addEventListener('click', () => {
      clearGlow();
      svg.transition().duration(700).call(zoomBehavior.transform, d3.zoomIdentity);
      searchBox.value = '';
      suggestionsEl.style.display = 'none';
    });

    function highlightTopic(query) {
      const q = (query || '').trim();
      if (!q) return;
      const match = idToNode.get(q.toLowerCase()) ? q : bestMatch(q);
      if (!match) {
        // brief visual feedback: shake search box
        const el = searchBox;
        el.style.transition = 'transform 60ms';
        let i = 0; const interval = setInterval(() => { el.style.transform = `translateX(${(i++ % 2 === 0) ? -3 : 3}px)`; if (i > 6) { clearInterval(interval); el.style.transform = 'translateX(0)'; } }, 60);
        return;
      }
      applyGlow(match.toLowerCase());
    }
  </script>
</body>
</html>
